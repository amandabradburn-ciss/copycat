<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class = "title-header">
        <h1>CopyCat</h1>
    </header>

    <p class="code-header">
        Welcome to CopyCat!<br>
        CopyCat is a code vulnerability scanner. Insert your code below and click "Submit" to scan for vulnerabilities.<br>
        Enter a passcode below for access to better AI models - ignore if you're running locally or don't have a passcode.
    </p>
    <div class="controls">
        <label class="language-label" id="languageLabel">Choose a language:</label>
            <select class ="language-select" name="language" id="languageSelect">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
        
            <input type="password" class="passcode-input" id="passcodeBox" placeholder="Enter passcode here">
        </div>
    <textarea class="code-input" id="textBox" placeholder="Insert code here"></textarea>


    <div class="submit-code">
        <button class="submit-button" id="submitCode">Submit</button>
    </div>

   <h2 class="hidden" id="resultsHeader">Results</h2>
    <pre class="hidden" id="output"></pre>

    <script src="script.js"></script>
</body>
</html>
