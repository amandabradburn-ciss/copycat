<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>CopyCat</h1>

    <p class="code-header">
        Insert your code in the text box below and click submit to see results
    </p>

    <textarea class="code-input" id="textBox" placeholder="Insert code here"></textarea>

    <div class="submit-code">
        <button class="submit-button" id="submitCode">Submit</button>
    </div>

    <p class = "hidden" id="output"></p>

    <script src="script.js"></script>
</body>
</html>
